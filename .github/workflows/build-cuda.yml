name: Build CUDA Wheels


on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        required: true
        type: string
        default: "3.12"
      cuda-version:
        description: "CUDA toolkit version (e.g., 13.0.0)"
        required: true
        type: string
        default: "13.0.0"
      torch-version:
        description: "PyTorch version (e.g., 2.10.0)"
        required: true
        type: string
        default: "2.10.0"
      torch-cuda-arch-list:
        description: "CUDA architectures to target (semicolon-separated)"
        required: true
        type: string
        default: "7.5;8.0;8.6;8.9;9.0;10.0;12.0;12.1"

      runs-on-long:
        description: "Base labels for long (>6h) self-hosted builds; X64/ARM64 is appended from the job arch"
        required: true
        type: string
        default: '["self-hosted","linux","cpu"]'
      container-image:
        description: "Container image for long builds (isolates apt/pip from the host)"
        required: true
        type: string
        default: "ubuntu:24.04"
      max-jobs-long:
        description: "Compile parallelism for long/self-hosted builds (0 = nproc)"
        required: true
        type: string
        default: "0"

      upload-to-release:
        description: "Upload built wheels to a GitHub release"
        type: boolean
        default: true
      override-previous:
        description: "Override existing release assets with the same name"
        type: boolean
        default: false
      release-tag:
        description: "Release tag (leave empty for auto: torch{X.Y}-cu{MAJMIN})"
        type: string
        default: ""

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  create-release:
    name: Create release
    if: ${{ inputs.upload-to-release }}
    timeout-minutes: 2160
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute release tag
        id: tag
        run: |
          TAG="${{ inputs.release-tag }}"
          if [ -z "$TAG" ]; then
            CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
            CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
            TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
            TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
            TAG="torch${TORCH_MAJOR}.${TORCH_MINOR}-cu${CUDA_MAJOR}${CUDA_MINOR}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release (if it does not exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "CUDA wheels for PyTorch ${{ inputs.torch-version }} + CUDA ${{ inputs.cuda-version }}" \
            2>/dev/null || true

  build-xformers:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch label is implicit from the matrix leg (not an input).
          # aarch64 stays on GitHub-hosted until a self-hosted ARM64 runner exists;
          # then switch that leg to the same runs-on-long + ARM64 expression as x86_64.
          - arch: x86_64
            runner: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
    name: Build xformers (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep "^xformers-" | grep -q "$ARCH"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::xformers ($ARCH) wheel already exists in release, skipping build"
          fi

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${{ inputs.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> $GITHUB_ENV
          CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
          echo "CUDA_SHORT=cu${CUDA_MAJOR}${CUDA_MINOR}" >> $GITHUB_ENV

      - name: Install CUDA ${{ inputs.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Install PyTorch
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${CUDA_SHORT}

      - name: Build xformers
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-xformers.sh

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-pyg:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: [pytorch_cluster, pytorch_sparse, pytorch_scatter]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.package }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          WHEEL_PREFIX=$(echo "${{ matrix.package }}" | sed 's/^pytorch_/torch_/')
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep "^${WHEEL_PREFIX}-" | grep -q "$ARCH"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::${WHEEL_PREFIX} ($ARCH) wheel already exists in release, skipping build"
          fi

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${{ inputs.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> $GITHUB_ENV
          CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
          echo "CUDA_SHORT=cu${CUDA_MAJOR}${CUDA_MINOR}" >> $GITHUB_ENV

      - name: Install CUDA ${{ inputs.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Install PyTorch
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${CUDA_SHORT}

      - name: Build ${{ matrix.package }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-pyg.sh "${{ matrix.package }}"

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  resolve-torchao:
    name: Resolve torchao versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve torchao matrix
        id: resolve
        run: |
          python3 scripts/resolve-torchao-versions.py \
            --torch "${{ inputs.torch-version }}" \
            --github-output

  build-torchao:
    needs: [create-release, resolve-torchao]
    if: ${{ always() && !cancelled() && needs.resolve-torchao.result == 'success' }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        torchao: ${{ fromJSON(needs.resolve-torchao.outputs.matrix) }}
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.torchao.primary }}
    name: Build torchao ${{ matrix.torchao.version }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          VER="${{ matrix.torchao.version }}"
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep -E "^torchao-${VER}([+-]|$)" | grep -q "$ARCH"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::torchao ${VER} ($ARCH) wheel already exists in release, skipping build"
          fi

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${{ inputs.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> $GITHUB_ENV
          echo "TORCHAO_VERSION=${{ matrix.torchao.version }}" >> $GITHUB_ENV
          CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
          echo "CUDA_SHORT=cu${CUDA_MAJOR}${CUDA_MINOR}" >> $GITHUB_ENV

      - name: Install CUDA ${{ inputs.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Install PyTorch
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${CUDA_SHORT}

      - name: Build torchao
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-torchao.sh

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-flash-attention:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch label is implicit from the matrix leg (not an input).
          # aarch64 stays on GitHub-hosted until a self-hosted ARM64 runner exists;
          # then switch that leg to the same runs-on-long + ARM64 expression as x86_64.
          - arch: x86_64
            runner: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
    name: Build flash-attention (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep "^flash_attn-" | grep -v "fa4" | grep -q "$ARCH"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::flash-attention 2 ($ARCH) wheel already exists in release, skipping build"
          fi

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${{ inputs.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> $GITHUB_ENV
          CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
          echo "CUDA_SHORT=cu${CUDA_MAJOR}${CUDA_MINOR}" >> $GITHUB_ENV

      - name: Install CUDA ${{ inputs.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Install PyTorch
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${CUDA_SHORT}

      - name: Build flash-attention
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-flash-attention.sh

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-flash-attention-4:
    name: Build flash-attention-4
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep -q "^flash_attn_4-"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::flash-attention-4 wheel already exists in release, skipping"
          fi

      - name: Build flash-attention-4
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-flash-attention-4.sh

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-vllm:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch label is implicit from the matrix leg (not an input).
          # aarch64 stays on GitHub-hosted until a self-hosted ARM64 runner exists;
          # then switch that leg to the same runs-on-long + ARM64 expression as x86_64.
          - arch: x86_64
            runner: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
    name: Build vllm (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep "^vllm-" | grep -q "$ARCH"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::vllm ($ARCH) wheel already exists in release, skipping build"
          fi

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android /usr/local/share/boost

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${{ inputs.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> $GITHUB_ENV
          CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
          echo "CUDA_SHORT=cu${CUDA_MAJOR}${CUDA_MINOR}" >> $GITHUB_ENV

      - name: Install CUDA ${{ inputs.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Install PyTorch
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${CUDA_SHORT}

      - name: Build vllm
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-vllm.sh

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          for whl in wheels/vllm-*.whl; do
            [ -f "$whl" ] || continue
            gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" "$whl" $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
              if grep -q "already exists" /tmp/upload.log; then
                echo "::warning::Wheel already exists in release, skipping upload"
              else
                exit 1
              fi
            }
          done

  build-mslk:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Arch label is implicit from the matrix leg (not an input).
          # aarch64 stays on GitHub-hosted until a self-hosted ARM64 runner exists;
          # then switch that leg to the same runs-on-long + ARM64 expression as x86_64.
          - arch: x86_64
            runner: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
    name: Build mslk (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCH=$(uname -m)
          ASSETS=$(gh release view "${{ needs.create-release.outputs.tag }}" --json assets -q '.assets[].name' 2>/dev/null || echo "")
          if echo "$ASSETS" | grep "^mslk-" | grep -q "$ARCH"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::mslk ($ARCH) wheel already exists in release, skipping build"
          fi

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android /usr/local/share/boost

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "CUDA_VERSION=${{ inputs.cuda-version }}" >> $GITHUB_ENV
          echo "TORCH_CUDA_ARCH_LIST=${{ inputs.torch-cuda-arch-list }}" >> $GITHUB_ENV
          CUDA_MAJOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f1)
          CUDA_MINOR=$(echo "${{ inputs.cuda-version }}" | cut -d. -f2)
          echo "CUDA_SHORT=cu${CUDA_MAJOR}${CUDA_MINOR}" >> $GITHUB_ENV

      - name: Install CUDA ${{ inputs.cuda-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc", "libraries-dev"]'

      - name: Install PyTorch
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${CUDA_SHORT}

      - name: Build mslk
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-mslk.sh

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          for whl in wheels/mslk-*.whl; do
            [ -f "$whl" ] || continue
            gh release upload -R "$GITHUB_REPOSITORY" "${{ needs.create-release.outputs.tag }}" "$whl" $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
              if grep -q "already exists" /tmp/upload.log; then
                echo "::warning::Wheel already exists in release, skipping upload"
              else
                exit 1
              fi
            }
          done
