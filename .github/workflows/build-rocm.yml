name: Build ROCm Wheels


on:
  workflow_dispatch:
    inputs:
      python-version:
        description: "Python version"
        required: true
        type: string
        default: "3.12"
      rocm-versions:
        description: "ROCm versions to build (JSON array). Must have torch wheels for torch-version (7.0→2.10 only; 7.1/7.2→2.11+)."
        required: true
        type: string
        default: '["7.2"]'
      torch-version:
        description: "PyTorch version (e.g., 2.12.0)"
        required: true
        type: string
        default: "2.12.0"
      pytorch-rocm-arch:
        description: "ROCm GPU architectures to target (semicolon-separated)"
        required: true
        type: string
        default: "gfx950"

      runs-on-long:
        description: "Base labels for long (>6h) self-hosted builds; X64 is appended (ROCm is x86_64-only)"
        required: true
        type: string
        default: '["self-hosted","linux","cpu"]'
      container-image:
        description: "Container image for long builds (isolates apt/pip from the host)"
        required: true
        type: string
        default: "ubuntu:22.04"
      max-jobs-long:
        description: "Compile parallelism for long/self-hosted builds (0 = nproc)"
        required: true
        type: string
        default: "0"

      upload-to-release:
        description: "Upload built wheels to a GitHub release"
        type: boolean
        default: true
      override-previous:
        description: "Override existing release assets with the same name"
        type: boolean
        default: false

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

jobs:
  create-release:
    name: Create release (ROCm ${{ matrix.rocm-version }})
    if: ${{ inputs.upload-to-release }}
    timeout-minutes: 2160
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(inputs.rocm-versions) }}
    steps:
      - uses: actions/checkout@v5

      - name: Create release (if it does not exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
          TAG="torch${TORCH_MAJOR}.${TORCH_MINOR}-rocm${ROCM_MAJOR}.${ROCM_MINOR}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "ROCm wheels for PyTorch ${{ inputs.torch-version }} + ROCm ${{ matrix.rocm-version }}" \
            2>/dev/null || true

  build-xformers:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(inputs.rocm-versions) }}
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
      PYTORCH_ROCM_ARCH: ${{ inputs.pytorch-rocm-arch }}
    name: Build xformers (ROCm ${{ matrix.rocm-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Compute release tag
        id: rel
        run: |
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
          echo "tag=torch${TORCH_MAJOR}.${TORCH_MINOR}-rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_OUTPUT

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_BACKEND: rocm
          PYTORCH_VERSION: ${{ inputs.torch-version }}
          ROCM_VERSION: ${{ matrix.rocm-version }}
        run: bash scripts/ci-skip-if-wheel-exists.sh xformers "${{ steps.rel.outputs.tag }}"

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "GPU_BACKEND=rocm" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "ROCM_VERSION=${{ matrix.rocm-version }}" >> $GITHUB_ENV
          echo "PYTORCH_ROCM_ARCH=${{ inputs.pytorch-rocm-arch }}" >> $GITHUB_ENV
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          echo "ROCM_SHORT=rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_ENV

      - name: Install ROCm ${{ matrix.rocm-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/ci-install-rocm.sh "${{ matrix.rocm-version }}"

      - name: Install PyTorch (ROCm)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir numpy
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${ROCM_SHORT}

      - name: Build xformers
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-xformers.sh

      - name: Save wheel artifact
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: xformers-rocm${{ matrix.rocm-version }}-x86_64
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ steps.rel.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-pyg:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(inputs.rocm-versions) }}
        package: [pytorch_cluster, pytorch_sparse, pytorch_scatter]
    runs-on: ubuntu-22.04
    env:
      PYTORCH_ROCM_ARCH: ${{ inputs.pytorch-rocm-arch }}
    name: Build ${{ matrix.package }} (ROCm ${{ matrix.rocm-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Compute release tag
        id: rel
        run: |
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
          echo "tag=torch${TORCH_MAJOR}.${TORCH_MINOR}-rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_OUTPUT

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_BACKEND: rocm
          PYTORCH_VERSION: ${{ inputs.torch-version }}
          ROCM_VERSION: ${{ matrix.rocm-version }}
        run: bash scripts/ci-skip-if-wheel-exists.sh "${{ matrix.package }}" "${{ steps.rel.outputs.tag }}"

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "GPU_BACKEND=rocm" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "ROCM_VERSION=${{ matrix.rocm-version }}" >> $GITHUB_ENV
          echo "PYTORCH_ROCM_ARCH=${{ inputs.pytorch-rocm-arch }}" >> $GITHUB_ENV
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          echo "ROCM_SHORT=rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_ENV

      - name: Install ROCm ${{ matrix.rocm-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/ci-install-rocm.sh "${{ matrix.rocm-version }}"

      - name: Install PyTorch (ROCm)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir numpy
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${ROCM_SHORT}

      - name: Build ${{ matrix.package }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-pyg.sh "${{ matrix.package }}"

      - name: Save wheel artifact
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-rocm${{ matrix.rocm-version }}-x86_64
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ steps.rel.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  resolve-torchao:
    name: Resolve torchao versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve torchao matrix
        id: resolve
        run: |
          python3 scripts/resolve-torchao-versions.py \
            --torch "${{ inputs.torch-version }}" \
            --github-output

  build-torchao:
    needs: [create-release, resolve-torchao]
    if: ${{ always() && !cancelled() && needs.resolve-torchao.result == 'success' }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(inputs.rocm-versions) }}
        torchao: ${{ fromJSON(needs.resolve-torchao.outputs.matrix) }}
    runs-on: ubuntu-22.04
    continue-on-error: ${{ !matrix.torchao.primary }}
    env:
      PYTORCH_ROCM_ARCH: ${{ inputs.pytorch-rocm-arch }}
    name: Build torchao ${{ matrix.torchao.version }} (ROCm ${{ matrix.rocm-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Compute release tag
        id: rel
        run: |
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
          echo "tag=torch${TORCH_MAJOR}.${TORCH_MINOR}-rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_OUTPUT

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_BACKEND: rocm
          PYTORCH_VERSION: ${{ inputs.torch-version }}
          ROCM_VERSION: ${{ matrix.rocm-version }}
          TORCHAO_VERSION: ${{ matrix.torchao.version }}
        run: bash scripts/ci-skip-if-wheel-exists.sh torchao "${{ steps.rel.outputs.tag }}"

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "GPU_BACKEND=rocm" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "ROCM_VERSION=${{ matrix.rocm-version }}" >> $GITHUB_ENV
          echo "PYTORCH_ROCM_ARCH=${{ inputs.pytorch-rocm-arch }}" >> $GITHUB_ENV
          echo "TORCHAO_VERSION=${{ matrix.torchao.version }}" >> $GITHUB_ENV
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          echo "ROCM_SHORT=rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_ENV

      - name: Install ROCm ${{ matrix.rocm-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/ci-install-rocm.sh "${{ matrix.rocm-version }}"

      - name: Install PyTorch (ROCm)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir numpy
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${ROCM_SHORT}

      - name: Build torchao
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-torchao.sh

      - name: Save wheel artifact
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: torchao-${{ matrix.torchao.version }}-rocm${{ matrix.rocm-version }}-x86_64
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ steps.rel.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-flash-attention:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(inputs.rocm-versions) }}
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
      PYTORCH_ROCM_ARCH: ${{ inputs.pytorch-rocm-arch }}
    name: Build flash-attention (ROCm ${{ matrix.rocm-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Compute release tag
        id: rel
        run: |
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
          echo "tag=torch${TORCH_MAJOR}.${TORCH_MINOR}-rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_OUTPUT

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_BACKEND: rocm
          PYTORCH_VERSION: ${{ inputs.torch-version }}
          ROCM_VERSION: ${{ matrix.rocm-version }}
        run: bash scripts/ci-skip-if-wheel-exists.sh flash-attention "${{ steps.rel.outputs.tag }}"

      - name: Free disk space
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Set up Python
        if: ${{ steps.check.outputs.skip != 'true' && env.WHEELS_IN_CONTAINER != '1' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set environment from inputs
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          echo "GPU_BACKEND=rocm" >> $GITHUB_ENV
          echo "PYTORCH_VERSION=${{ inputs.torch-version }}" >> $GITHUB_ENV
          echo "ROCM_VERSION=${{ matrix.rocm-version }}" >> $GITHUB_ENV
          echo "PYTORCH_ROCM_ARCH=${{ inputs.pytorch-rocm-arch }}" >> $GITHUB_ENV
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          echo "ROCM_SHORT=rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_ENV

      - name: Install ROCm ${{ matrix.rocm-version }}
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/ci-install-rocm.sh "${{ matrix.rocm-version }}"

      - name: Install PyTorch (ROCm)
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir numpy
          pip install --no-cache-dir torch==${{ inputs.torch-version }} \
            --index-url https://download.pytorch.org/whl/${ROCM_SHORT}

      - name: Build flash-attention
        if: ${{ steps.check.outputs.skip != 'true' }}
        run: bash scripts/build-flash-attention.sh

      - name: Save wheel artifact
        if: ${{ steps.check.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-rocm${{ matrix.rocm-version }}-x86_64
          path: wheels/*.whl
          if-no-files-found: error
          retention-days: 14

      - name: Upload wheel to release
        if: ${{ steps.check.outputs.skip != 'true' && inputs.upload-to-release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CLOBBER_FLAG=""
          if [ "${{ inputs.override-previous }}" = "true" ]; then
            CLOBBER_FLAG="--clobber"
          fi
          gh release upload -R "$GITHUB_REPOSITORY" "${{ steps.rel.outputs.tag }}" wheels/*.whl $CLOBBER_FLAG 2>&1 | tee /tmp/upload.log || {
            if grep -q "already exists" /tmp/upload.log; then
              echo "::warning::Wheel already exists in release, skipping upload"
            else
              exit 1
            fi
          }

  build-aiter:
    needs: [create-release]
    if: ${{ always() && !cancelled() }}
    timeout-minutes: 2160
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(inputs.rocm-versions) }}
    runs-on: ${{ fromJSON(format('["{0}","{1}"]', join(fromJSON(inputs.runs-on-long), '","'), 'X64')) }}
    container:
      image: ${{ inputs.container-image }}
    env:
      WHEELS_IN_CONTAINER: "1"
      MAX_JOBS: ${{ inputs.max-jobs-long }}
      PYTORCH_ROCM_ARCH: ${{ inputs.pytorch-rocm-arch }}
    name: Build aiter (ROCm ${{ matrix.rocm-version }})
    steps:
      - uses: actions/checkout@v5

      - name: Bootstrap container
        if: ${{ env.WHEELS_IN_CONTAINER == '1' }}
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        run: bash scripts/ci-bootstrap-container.sh

      - name: Compute release tag
        id: rel
        run: |
          ROCM_MAJOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f1)
          ROCM_MINOR=$(echo "${{ matrix.rocm-version }}" | cut -d. -f2)
          TORCH_MAJOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f1)
          TORCH_MINOR=$(echo "${{ inputs.torch-version }}" | cut -d. -f2)
          echo "tag=torch${TORCH_MAJOR}.${TORCH_MINOR}-rocm${ROCM_MAJOR}.${ROCM_MINOR}" >> $GITHUB_OUTPUT

      - name: Check if wheel already exists
        id: check
        if: ${{ inputs.upload-to-release && !inputs.override-previous }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPU_BACKEND: rocm
          PYTORCH_VERSION: ${{ inputs.torch-version }}
          ROCM_VERSION: ${{ matrix.rocm-version }}
